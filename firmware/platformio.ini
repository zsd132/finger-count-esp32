; PlatformIO project for ESP32 + 0.96" SSD1306 OLED (I2C)
;
; VS Code: install the "PlatformIO IDE" extension, open this "firmware" folder,
; then click the "Upload" (arrow) button in the bottom status bar.
;
; If your board is ESP32-C3 / S3 / S2, change "board" and the I2C pins below:
;   ESP32-C3 DevKitM-1 -> board = esp32-c3-devkitm-1, SDA=8, SCL=9
;   ESP32-S3 DevKitC-1 -> board = esp32-s3-devkitc-1, SDA=8, SCL=9

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    olikraus/U8g2@^2.36.5
build_flags =
    -DCORE_DEBUG_LEVEL=0
